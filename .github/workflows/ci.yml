name: CI

# Type-checks, lints and builds the static site. Deployment itself is done by Cloudflare Pages
# (connected to this repo), so this workflow only has to prove that `main` always builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

      # Reads the live database (NEXT_PUBLIC_DATABASE_INDEX_URL, default in src/lib/config.ts).
      - run: pnpm build
